# Builds the Eleventy site and publishes it to GitHub Pages.
#
# This replaces the Jekyll build GitHub runs by default. Pages must be set to
# Settings -> Pages -> Source: "GitHub Actions", otherwise GitHub keeps running its own
# jekyll-build-pages workflow against the source, which cannot parse Nunjucks templates.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reports where the site will be served from: origin is the bare host, base_path is
      # the repo sub-path ("/geosustara" for a project site, empty for a user site).
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci

      - name: Build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          PATH_PREFIX: ${{ steps.pages.outputs.base_path }}
          # The github.io copy must never compete with geosustara.com in search results.
          # Remove this only if GitHub Pages becomes the production host.
          NOINDEX: '1'
        run: npm run build

      # Stops Pages from running the published output through Jekyll a second time.
      - run: touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
